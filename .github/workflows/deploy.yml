name: Deploy to Vercel

# Yalnız ELLE tetiklenir: canonical dağıtım yolu GitLab main → Vercel'dir
# (bkz. CLAUDE.md). Bu workflow otomatik push tetikleyicisiyle çalışsaydı
# GitHub aynasındaki her push'ta ÇAKIŞAN, rakip bir Vercel dağıtımı
# oluşturur — bu yüzden push tetikleyicisi kasıtlı olarak kaldırıldı.
# Acil durumda (GitLab erişilemezse) elle tetiklemek için burada kalıyor.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
