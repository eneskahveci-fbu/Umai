# UMAI — iOS (SwiftUI) proje tanımı
#
# NEDEN XcodeGen? Elle yazılmış bir .xcodeproj/project.pbxproj, tek bir yanlış
# UUID'de Xcode'un anlaşılmaz hatalar vermesine yol açar ve gözle denetlenemez.
# Bu dosya okunabilir, sürüm kontrolünde anlamlı diff üretir ve tek komutla
# gerçek projeyi üretir:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open UMAI.xcodeproj
#
name: UMAI
options:
  bundleIdPrefix: com.umai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # Xcode > Signing & Capabilities'ten kendi Team ID'ni seç
    CODE_SIGN_STYLE: Automatic
    # `complete` değil `targeted`: proje bir Xcode'da derlenmeden yazıldı ve
    # tam eşzamanlılık denetimi SwiftUI sınır noktalarında çok sayıda gürültü
    # üretir. Derleme oturduktan sonra `complete`e yükseltmek doğru sıradır.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Uygulama YALNIZCA HTTPS kullanır; ATS istisnası YOK (App Store incelemesinde
    # istisna istemek gereksiz soru doğurur ve gerekmiyor).
    # NOT: `-warnings-as-errors` bilinçli olarak KONULMADI — ilk derlemede
    # önemsiz bir uyarının yayını bloke etmesi istenmez.

targets:
  UMAI:
    type: application
    platform: iOS
    sources:
      - path: UMAI
        excludes:
          - "**/.DS_Store"
    resources:
      - path: UMAI/Resources
    info:
      path: UMAI/Info.plist
      properties:
        CFBundleDisplayName: UMAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        # İHRACAT UYUMU (App Store zorunlu sorusu):
        # Uygulama yalnızca platformun standart HTTPS/TLS'ini kullanır; kendi
        # şifreleme algoritmasını içermez → muaf. Bu anahtar olmadan her
        # yüklemede manuel soru sorulur ve yayın gecikir.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: UMAI/UMAI.entitlements
      properties:
        # Keychain erişim grubu — API anahtarları burada saklanır.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.umai.app
    dependencies: []
    scheme:
      testTargets:
        - UMAITests
      gatherCoverageData: true

  UMAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UMAITests
    dependencies:
      - target: UMAI
