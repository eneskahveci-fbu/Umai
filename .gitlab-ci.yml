# craft.ai — Hafif CI (kota dostu)
# Yalnızca Merge Request ve main'de çalışır; tek iş, hızlı kontroller.
# Build adımı bilerek dışarıda (en pahalı adım) — kota tasarrufu için.
stages:
  - verify

verify:
  stage: verify
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    - npm run lint
    - npm test
  interruptible: true
