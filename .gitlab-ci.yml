# CI: her push ve merge request'te lint + test + build çalıştırır.
# Üretim deploy'u Vercel tarafından yapılır; bu pipeline yalnızca bozuk
# commit'leri (lint/tip/test/build hatası) Vercel'e gitmeden yakalamak içindir.

default:
  image: node:20-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false

stages:
  - quality

lint:
  stage: quality
  script:
    - npm run lint

test:
  stage: quality
  script:
    - npm run test

build:
  stage: quality
  variables:
    NEXT_PUBLIC_SITE_URL: ""
  script:
    - npm run build
