# craft.ai — CI GEÇİCİ OLARAK KAPALI
# GitLab paylaşımlı runner CI/CD dakika kotası tükendi → pipeline'lar
# "ci_quota_exceeded" ile düşüyordu (kod sorunu değil). Vercel deploy'u
# GitLab CI'dan bağımsızdır, bundan etkilenmez.
# Kod kontrolleri yerelde yapılıyor: npx tsc --noEmit && npm run lint && npm test
# YENİDEN AÇMAK için aşağıdaki `workflow:` bloğunu sil (kota ayın 1'inde
# sıfırlanır; ya da kendi GitLab Runner'ını kaydet → ücretsiz, sınırsız).
workflow:
  rules:
    - when: never

# --- Kota dönünce aktifleşecek hafif doğrulama işi (şimdilik workflow ile kapalı) ---
stages:
  - verify

verify:
  stage: verify
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    - npm run lint
    - npm test
  interruptible: true
