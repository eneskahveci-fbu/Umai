# ─────────────────────────────────────────────────────────────────────────
# GitLab CI DEVRE DIŞI — bilinçli karar (compute kotası tüketmemek için).
#
# Neden kapalı?
#   • GitLab paylaşımlı runner'ları "compute minutes" harcar ve kota dolunca
#     pipeline'lar ci_quota_exceeded ile başarısız olur (kırmızı pipeline/mail).
#   • Kaliteyi kapatmıyoruz; iki katman zaten koruyor:
#       1) Geliştirici/asistan her push ÖNCESİ yerelde çalıştırır:
#            npm run lint && npm run test && npm run build
#          → bozuk commit repoya hiç ulaşmaz.
#       2) Vercel, üretim build'ini deploy'dan ÖNCE çalıştırır → build hatası
#          canlıya çıkmaz.
#   • Sonuç: compute=0, kota hatası=0, bakım=0.
#
# Tekrar açmak istersen: aşağıdaki "when: never"ı kaldır ve eski işleri ekle
# (lint/test/build). Önerilen hafif sürüm tek iş + workflow.rules ile sadece
# merge request + main'de çalışacak şekilde kurulur.
# ─────────────────────────────────────────────────────────────────────────

workflow:
  rules:
    - when: never
